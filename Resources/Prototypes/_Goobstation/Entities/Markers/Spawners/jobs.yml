# Command

- type: entity
  id: SpawnPointBlueshieldOfficer
  parent: SpawnPointJobBase
  name: blueshieldofficer
  components:
  - type: SpawnPoint
    job_id: BlueshieldOfficer
  - type: Sprite
    layers:
      - state: green
      - state: ertleader

- type: entity
  id: SpawnPointNanotrasenRepresentative
  parent: SpawnPointJobBase
  name: nanotrasenrepresentative
  components:
  - type: SpawnPoint
    job_id: NanotrasenRepresentative
  - type: Sprite
    layers:
      - state: green
      - state: centcom

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  id: GhostBarSpawner
  name: ghost role spawn point
  suffix: ghost bar patron
  parent: MarkerBase
  components:
  - type: GhostRole
    name: ghost-role-information-ghostbar-name
    description: ghost-role-information-ghostbar-description
    rules: ghost-role-information-ghostbar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobHuman
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
