- type: entity
  id: MeleeHammer
  parent: BaseItem
  name: hammer
  description: A compact hammer for rugged field work.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/hammer.rsi
    state: icon
  - type: MeleeWeapon
    animationRotation: -90
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Blunt: 12
    soundHit:
      collection: MetalThud
  - type: Item
    size: Small
    sprite: _Goobstation/Objects/Weapons/Melee/hammer.rsi
  - type: Tag
    tags:
    - Hammer
  - type: Tool
    qualities:
    - Hammering
    useSound:
      path: /Audio/Items/trayhit2.ogg

