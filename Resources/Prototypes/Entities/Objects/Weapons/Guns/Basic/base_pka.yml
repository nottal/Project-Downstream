- type: entity
  id: WeaponProtoKineticAcceleratorBase
  abstract: true
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
  - type: Item
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    size: Large
    shape:
    - 0,0,2,1
  - type: PressureDamageChange
    applyToMelee: false
  - type: ItemUpgradeable
  - type: MeleeWeaponRelay
  - type: ContainerContainer
    containers:
      bayonet: !type:ContainerSlot
      flashlight: !type:ContainerSlot
      upgrade_slot_1: !type:ContainerSlot
      upgrade_slot_2: !type:ContainerSlot
      upgrade_slot_3: !type:ContainerSlot
      upgrade_slot_4: !type:ContainerSlot
  - type: ItemSlots
    slots:
      bayonet:
        name: weapon-upgrade-slot-name-bayonet
        priority: 6
        insertDelay: 0.4
        ejectDelay: 0.4
        ejectOnBreak: true
        whitelist:
          components:
          - GunUpgradeBayonet
      flashlight:
        name: weapon-upgrade-slot-name-flashlight
        priority: 5
        insertDelay: 0.1
        ejectDelay: 0.1
        ejectOnBreak: true
        occludesLight: false
        whitelist:
          components:
          - GunUpgradeFlashlight
      upgrade_slot_1:
        name: weapon-upgrade-slot-name-first
        swap: false
        priority: 4
        insertDelay: 1.2
        ejectDelay: 0.9
        whitelist:
          tags:
          - PKAUpgrade
      upgrade_slot_2:
        name: weapon-upgrade-slot-name-second
        swap: false
        priority: 3
        insertDelay: 1.2
        ejectDelay: 0.9
        whitelist:
          tags:
          - PKAUpgrade
      upgrade_slot_3:
        name: weapon-upgrade-slot-name-third
        swap: false
        priority: 2
        insertDelay: 1.2
        ejectDelay: 0.9
        whitelist:
          tags:
          - PKAUpgrade
      upgrade_slot_4:
        name: weapon-upgrade-slot-name-fourth
        swap: false
        priority: 2
        insertDelay: 1.2
        ejectDelay: 0.9
        whitelist:
          tags:
          - PKAUpgrade
  - type: ItemMapper
    mapLayers:
      bayonet:
        whitelist:
          components:
          - GunUpgradeBayonet
      flight:
        whitelist:
          components:
          - GunUpgradeFlashlight
      upgrade-space:
        whitelist:
          tags:
          - PKAUpgradeSpace
  - type: GunWieldBonus
    minAngle: -43
    maxAngle: -43
  - type: Wieldable
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    angleDecay: 45
    minAngle: 44
    maxAngle: 45
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        #todo: add other 'empty' animations
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletKinetic
    capacity: 1
    count: 1
  - type: Clothing
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    quickEquip: false
    slots:
    - backStorage
    - Belt
  - type: UseDelay
    delay: 1
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
      Glass: 125
      Silver: 25
